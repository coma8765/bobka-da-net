    <rect x="815" y="1062" width="78" height="34" fill="#e2e8f0" stroke="#475569"/><text class="legend" x="910" y="1084">сущность</text>
    <polygon points="854,1110 893,1129 854,1148 815,1129" fill="#e2e8f0" stroke="#475569"/><text class="legend" x="910" y="1134">связь</text>
