    <line x1="1700" y1="270" x2="1950" y2="125"/><line x1="1580" y1="295" x2="1425" y2="235"/>
    <line x1="1580" y1="320" x2="1425" y2="405"/><line x1="1820" y1="295" x2="1970" y2="235"/>
    <line x1="1820" y1="320" x2="1970" y2="405"/>
