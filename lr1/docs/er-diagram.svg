    <text class="relation-text" x="1050" y="605" text-anchor="middle">DELIVERY</text>
  </g>
  <g>
    <ellipse class="attribute" cx="820" cy="395" rx="96" ry="30"/><text class="key-text" x="820" y="400" text-anchor="middle">delivery_id</text>
    <ellipse class="attribute" cx="1050" cy="360" rx="102" ry="30"/><text class="attribute-text" x="1050" y="365" text-anchor="middle">delivered_at</text>
    <ellipse class="attribute" cx="1280" cy="410" rx="88" ry="30"/><text class="attribute-text" x="1280" y="415" text-anchor="middle">quantity</text>
