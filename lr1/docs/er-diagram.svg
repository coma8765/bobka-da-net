    <line x1="1095" y1="545" x2="1280" y2="410"/><line x1="1140" y1="600" x2="1380" y2="540"/>
    <line x1="1140" y1="615" x2="1390" y2="650"/><line x1="1090" y1="655" x2="1245" y2="790"/>
