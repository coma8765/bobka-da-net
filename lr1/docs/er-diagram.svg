<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1400" viewBox="0 0 2100 1400" role="img" aria-labelledby="title description">
  <title id="title">ER-диаграмма supply_lab в нотации Чена</title>
  <desc id="description">Концептуальная схема первой лабораторной работы: сущности поставщик, товар, склад и складская секция, тернарная связь поставки, связь склада с секциями и рекурсивная иерархия секций.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .page-title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #64748b; }
      .entity-text { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .relation-text { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .attribute-text { font: 13px 'Courier New', monospace; fill: #1e293b; }
      .key-text { font: 700 13px 'Courier New', monospace; fill: #0f172a; text-decoration: underline; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; }
      .attribute-edge { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
      .attribute { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
      .cardinality { font: 700 14px Arial, sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; }
      .role { font: 13px Arial, sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; }
      .legend-title { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .legend { font: 13px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="2100" height="1400" fill="#f8fafc"/>
  <text class="page-title" x="1050" y="45" text-anchor="middle">ER-диаграмма базы данных supply_lab</text>
  <text class="subtitle" x="1050" y="72" text-anchor="middle">Нотация Чена · состояние схемы на момент реализации лабораторной работы № 1</text>

  <!-- Связи между сущностями -->
  <path class="edge" d="M540 305 C720 305 805 470 960 555"/>
  <text class="cardinality" x="570" y="294">1</text>
  <text class="cardinality" x="930" y="535">N</text>

  <path class="edge" d="M540 1015 C735 1015 815 760 960 645"/>
  <text class="cardinality" x="570" y="1004">1</text>
  <text class="cardinality" x="930" y="675">N</text>

  <path class="edge" d="M1580 305 C1395 305 1305 470 1140 555"/>
  <text class="cardinality" x="1548" y="294">1</text>
  <text class="cardinality" x="1155" y="535">N</text>

  <path class="edge" d="M1700 340 V555"/>
  <path class="edge" d="M1700 685 V980"/>
  <text class="cardinality" x="1716" y="375">1</text>
  <text class="cardinality" x="1716" y="955">N</text>

  <path class="edge" d="M1820 997 C1855 940 1880 930 1930 950"/>
  <path class="edge" d="M1820 1033 C1855 1090 1880 1100 1930 1080"/>
  <text class="cardinality" x="1840" y="955">0..1</text>
  <text class="role" x="1835" y="930">родитель</text>
  <text class="cardinality" x="1845" y="1092">N</text>
  <text class="role" x="1820" y="1120">дочерняя секция</text>

