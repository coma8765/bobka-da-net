    <ellipse class="attribute" cx="690" cy="425" rx="92" ry="30"/><text class="attribute-text" x="690" y="430" text-anchor="middle">is_active</text>
    <ellipse class="attribute" cx="420" cy="480" rx="92" ry="30"/><text class="attribute-text" x="420" y="485" text-anchor="middle">created_at</text>
  </g>

