    <ellipse class="attribute" cx="170" cy="855" rx="96" ry="30"/><text class="key-text" x="170" y="860" text-anchor="middle">product_id</text>
    <ellipse class="attribute" cx="420" cy="845" rx="86" ry="30"/><text class="attribute-text" x="420" y="850" text-anchor="middle">sku (UQ)</text>
